{{ define "main" }}
<div class="container">
    <div class="row">
        <div class="col">
            <h3>{{ .Title }}</h3>
            {{ with .Params.subtitle }}
            <h4 class="text-secondary h4">{{ . }}</h4>
            {{ end }}
            {{ .Content | markdownify }}
        </div>
    </div>
</div>
{{ end }}
